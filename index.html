 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Object</title>
 </head>
 <body>
    <h1>JS Object Demo</h1>
    <script>
        var x=10
        x=20
        var x=30
        console.log("Var : Value of x is:",x);
        document.write("Var : Value of x is:",x)
        let a=10
        a=20
        //let a=30
        console.log("Value of a is:",a);
        document.write("<br>Value of a is:",a)
        let b=10
        b=20
        //let b=30
        console.log("Let : Value of b is:",b);
        document.write("<br>Let : Value of b is:",b)
        const c=10
        //c=20
        //let c=30
        console.log("Const : Value of c is:",c);
        document.write("<br>Const : Value of c is:",c)
        const student={
            name:"Student",
            email:"student@gmail.com",
            age:21
        }
        console.log(student)
        document.write("<br><br>Name: ",student.name)
        document.write("<br>Email: ",student.email)
        document.write("<br>Age: ",student.age)
    </script>
 </body>
 </html>
